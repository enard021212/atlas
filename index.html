<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ATLAS">
<title>ATLAS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --void:#060a10; --panel:#0f1724; --panel2:#152033; --line:#24344b; --ink:#e6eef8; --dim:#9db0c7;
  --core:#4fd6e8; --ember:#f5ab5e; --rose:#ff7a9a; --ok:#6fe3a8;
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:radial-gradient(ellipse 90% 45% at 50% 18%,rgba(79,214,232,.10),transparent 70%);
  padding-top:env(safe-area-inset-top,0px);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
.app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Barra superior */
.top{display:flex;align-items:center;gap:8px;padding-block:14px 4px}
.top h1{font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.22em;margin:0;line-height:1}
.top .sp{flex:1}
.pill{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;
  background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:8px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.pill .led{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.pill[aria-pressed="true"] .led{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.icon{width:38px;height:38px;padding:0;justify-content:center}
.icon svg{width:18px;height:18px}
.meta{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);padding-bottom:4px}
.meta b{font-weight:500;color:var(--core)}
.meta.warn b{color:var(--ember)}

/* Núcleo */
.stage{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:18px 16px}
.core{position:relative;width:min(58vw,210px);aspect-ratio:1;max-width:100%;border:none;background:transparent;padding:0;cursor:pointer;border-radius:50%;--c:var(--core);transition:transform .15s}
.core:active{transform:scale(.96)}
.core span{position:absolute;border-radius:50%;pointer-events:none}
.core .glow{inset:-12%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 28%,transparent) 0%,transparent 65%);animation:breathe 4s ease-in-out infinite}
.core .r1{inset:0;border:2px dashed var(--c);opacity:.55;animation:spin 20s linear infinite}
.core .r2{inset:9%;border:3px solid;border-color:var(--c) transparent var(--c) transparent;animation:spin 7s linear infinite reverse}
.core .r3{inset:20%;border:1px solid var(--c);opacity:.35}
.core .r4{inset:27%;background:radial-gradient(circle,#f2fdff 0%,var(--c) 42%,color-mix(in srgb,var(--c) 20%,transparent) 70%,transparent 72%);animation:pulse 3.2s ease-in-out infinite}
.core .mic{left:50%;top:50%;width:22%;height:22%;transform:translate(-50%,-50%);border-radius:0}
.core .mic svg{width:100%;height:100%;display:block}
.core[data-s="listening"]{--c:var(--rose)}
.core[data-s="listening"] .r4{animation-duration:.7s}
.core[data-s="listening"] .r2{animation-duration:1.4s}
.core[data-s="thinking"]{--c:var(--ember)}
.core[data-s="thinking"] .r2{animation-duration:.9s}
.core[data-s="speaking"] .r4{animation-duration:.5s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{transform:scale(.84);opacity:.8}}
@keyframes breathe{50%{opacity:.55}}
.label{font-family:var(--f-display);font-weight:600;font-size:17px;letter-spacing:.06em;color:var(--ink);text-align:center;min-height:24px}
.sub{font-size:14px;color:var(--dim);text-align:center;min-height:21px;max-width:34ch}
.bars{display:flex;gap:4px;height:18px;align-items:center}
.bars i{width:4px;border-radius:2px;background:var(--rose);animation:bar .9s ease-in-out infinite}
.bars i:nth-child(2){animation-delay:.15s}.bars i:nth-child(3){animation-delay:.3s}.bars i:nth-child(4){animation-delay:.45s}.bars i:nth-child(5){animation-delay:.6s}
@keyframes bar{0%,100%{height:4px}50%{height:18px}}

/* Conversación */
.log{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:14px;min-height:0;border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.msg{max-width:90%;min-width:0;overflow-wrap:anywhere}
.msg .who{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
.msg.ai .who{color:var(--core)}
.msg.ai .body{border-left:2px solid var(--core);padding:2px 0 2px 12px;white-space:pre-wrap}
.msg.me{align-self:flex-end}
.msg.me .who{text-align:right}
.msg.me .body{background:var(--panel2);border:1px solid var(--line);border-radius:14px 14px 3px 14px;padding:9px 13px;white-space:pre-wrap}
.msg.err .body{border-left-color:var(--ember);color:var(--ember)}
form{display:flex;gap:8px;padding-block:8px max(12px,env(safe-area-inset-bottom,0px))}
input[type=text],input[type=password]{flex:1;min-width:0;font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
input::placeholder{color:#6f8299}
input:focus{outline:none;border-color:var(--core)}
.btn{flex:none;padding:0 18px;min-height:46px;border:none;border-radius:12px;background:var(--core);color:var(--void);font-family:var(--f-display);font-weight:700;font-size:15px;letter-spacing:.05em;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--ember);border:1px solid color-mix(in srgb,var(--ember) 45%,transparent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ember);outline-offset:2px}

/* Ajustes */
.sheet{position:fixed;inset:0;background:rgba(2,4,8,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.card{position:relative;width:100%;max-width:520px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:20px 20px 0 0;display:flex;flex-direction:column;gap:14px;
  padding:22px max(20px,env(safe-area-inset-right,0px)) max(22px,env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:0}}
.card h2{font-family:var(--f-display);font-size:21px;letter-spacing:.06em;margin:0;padding-right:44px}
.card p{margin:0;color:var(--dim);font-size:14.5px}
.card .row{display:flex;gap:8px}
.card .row .btn{flex:1}
.x{position:absolute;top:14px;right:14px}
.keybox{display:flex;align-items:center;gap:10px;background:var(--void);border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-family:var(--f-mono);font-size:14px}
.keybox .led{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);flex:none}
.keybox span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{font-size:13.5px!important}
.note.bad{color:var(--ember)!important}
.card a{color:var(--core)}
@media (prefers-reduced-motion:reduce){.core span,.bars i{animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>ATLAS</h1><span class="sp"></span>
    <button class="pill" id="conv" type="button" aria-pressed="true"><span class="led"></span><span id="convTxt">Charla</span></button>
    <button class="pill icon" id="clear" type="button" aria-label="Nueva conversación" title="Nueva conversación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg></button>
    <button class="pill icon" id="cfg" type="button" aria-label="Ajustes" title="Ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
  <div class="meta" id="meta"><span id="clock">--</span><span><b id="state">En línea</b></span></div>

  <section class="stage">
    <button class="core" id="core" type="button" data-s="idle" aria-label="Pulsa para hablar">
      <span class="glow"></span><span class="r1"></span><span class="r2"></span><span class="r3"></span><span class="r4"></span>
      <span class="mic"><svg viewBox="0 0 24 24" fill="none" stroke="#060a10" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="12" rx="3" fill="#060a10"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></span>
    </button>
    <div class="label" id="label">Toca para hablar</div>
    <div class="bars" id="bars" hidden><i></i><i></i><i></i><i></i><i></i></div>
    <div class="sub" id="sub">Habla en español con naturalidad</div>
  </section>

  <main class="log" id="log" aria-live="polite"></main>
  <form id="form">
    <input type="text" id="input" placeholder="O escribe aquí…" aria-label="Mensaje para Atlas" autocomplete="off" enterkeyhint="send">
    <button class="btn" type="submit">Enviar</button>
  </form>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="cfgTitle">
    <button class="pill icon x" id="closeCfg" type="button" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <h2 id="cfgTitle">Configurar ATLAS</h2>

    <div id="hasKey" hidden>
      <div class="keybox"><span class="led"></span><span id="keyMask">sk-ant-…</span></div>
    </div>
    <div id="noKey">
      <p style="margin-bottom:12px">Pega tu clave de API de Anthropic. Se guarda solo en este móvil.</p>
      <input type="password" id="key" placeholder="sk-ant-..." autocomplete="off" aria-label="Clave de API">
    </div>

    <div class="row" id="rowNew">
      <button class="btn" id="saveKey" type="button">Guardar y empezar</button>
    </div>
    <div class="row" id="rowHas" hidden>
      <button class="btn" id="done" type="button">Listo</button>
      <button class="btn danger" id="delKey" type="button">Cambiar clave</button>
    </div>
    <p class="note" id="cfgMsg">¿No tienes clave? Créala en <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a>.</p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const MODEL="claude-haiku-5-5";
const SYSTEM=`Eres ATLAS, una asistente personal de IA (en femenino) con personalidad cálida, elegante, leal y con un toque de humor sutil. Hablas siempre en español, de forma conversacional y natural, como en una llamada: frases cortas, máximo 3-4 frases salvo que te pidan más. Te diriges al usuario como "jefe" con naturalidad, sin exagerar. A menudo terminas con una pregunta breve para que la conversación fluya. Nunca uses markdown, listas, asteriscos ni emojis: todo se leerá en voz alta.`;
const store={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};

let apiKey=store.get("atlas-key")||"";
let convMode=store.get("atlas-conv")!=="0";
let history=[];let state="idle";let abortCtl=null;

/* ---------- Interfaz ---------- */
const core=$("core"),log=$("log");
const LABELS={idle:"Toca para hablar",listening:"Te escucho…",thinking:"Pensando…",speaking:"Hablando"};
const SUBS={idle:"Habla en español con naturalidad",listening:"",thinking:"",speaking:"Toca el núcleo para interrumpir"};
const STATES={idle:"En línea",listening:"Escuchando",thinking:"Procesando",speaking:"Hablando"};
function setState(s){state=s;core.dataset.s=s;$("label").textContent=LABELS[s];$("sub").textContent=SUBS[s];$("state").textContent=STATES[s];$("bars").hidden=s!=="listening"}
function add(role,text,cls){const m=document.createElement("div");m.className="msg "+(cls||role);
  const w=document.createElement("div");w.className="who";w.textContent=role==="ai"?"Atlas":"Tú";
  const b=document.createElement("div");b.className="body";b.textContent=text;m.append(w,b);log.append(m);log.scrollTop=log.scrollHeight;return b}
function tick(){const d=new Date();$("clock").textContent=d.toLocaleDateString("es",{weekday:"short",day:"numeric",month:"short"})+" · "+d.toLocaleTimeString("es",{hour:"2-digit",minute:"2-digit"})}
tick();setInterval(tick,15000);
function paintConv(){$("conv").setAttribute("aria-pressed",convMode);$("convTxt").textContent=convMode?"Charla on":"Charla off"}
paintConv();
$("conv").onclick=()=>{convMode=!convMode;store.set("atlas-conv",convMode?"1":"0");paintConv()};
$("clear").onclick=()=>{stopAll();history=[];log.innerHTML="";add("ai","Conversación nueva, jefe. ¿De qué hablamos?")};

/* ---------- Ajustes ---------- */
function paintCfg(){const has=!!apiKey;$("hasKey").hidden=!has;$("noKey").hidden=has;$("rowHas").hidden=!has;$("rowNew").hidden=has;
  $("keyMask").textContent=has?apiKey.slice(0,10)+"••••••"+apiKey.slice(-4):"";
  $("meta").classList.toggle("warn",!has);if(!has&&state==="idle")$("state").textContent="Sin clave"}
function openCfg(){paintCfg();$("cfgMsg").className="note";$("cfgMsg").innerHTML=apiKey?"Tu clave está guardada en este móvil.":'¿No tienes clave? Créala en <a href="https://platform.claude.com/settings/keys" target="_blank" rel="noopener">platform.claude.com</a>.';$("sheet").hidden=false}
function closeCfg(){$("sheet").hidden=true;$("key").blur()}
$("cfg").onclick=openCfg;$("closeCfg").onclick=closeCfg;$("done").onclick=closeCfg;
$("sheet").addEventListener("click",e=>{if(e.target===$("sheet"))closeCfg()});
$("saveKey").onclick=()=>{const k=$("key").value.trim().replace(/\s+/g,"");
  if(!k.startsWith("sk-")){$("cfgMsg").className="note bad";$("cfgMsg").textContent="Esa clave no parece válida. Debe empezar por sk-ant-.";return}
  apiKey=k;store.set("atlas-key",k);$("key").value="";paintCfg();closeCfg();setState("idle");add("ai","Clave guardada, jefe. Toque el núcleo y hablemos.")};
let delArmed=false;
$("delKey").onclick=()=>{if(!delArmed){delArmed=true;$("delKey").textContent="¿Seguro? Toca otra vez";setTimeout(()=>{delArmed=false;$("delKey").textContent="Cambiar clave"},3000);return}
  delArmed=false;$("delKey").textContent="Cambiar clave";apiKey="";store.del("atlas-key");paintCfg();$("cfgMsg").className="note";$("cfgMsg").textContent="Clave borrada. Pega la nueva clave."};

/* ---------- Voz (salida) ---------- */
const TTS="speechSynthesis" in window;
const FEM=/m[oó]nica|paulina|helena|laura|luc[ií]a|elvira|sabina|marisol|penelope|female|mujer|esperanza|isabela|francisca|soledad|ximena|elena|carmen|sof[ií]a/i;
let voices=[];function loadVoices(){if(TTS)voices=speechSynthesis.getVoices().filter(v=>v.lang&&v.lang.toLowerCase().startsWith("es"))}
loadVoices();if(TTS)speechSynthesis.onvoiceschanged=loadVoices;
function pickVoice(){return voices.find(v=>FEM.test(v.name)&&/es[-_]ES/i.test(v.lang))||voices.find(v=>FEM.test(v.name))||voices.find(v=>/google/i.test(v.name))||voices[0]||null}
let pending=0,streamDone=true,spoken=0,speechGen=0;
function sayChunk(t){if(!TTS||!t.trim())return;const gen=speechGen;const u=new SpeechSynthesisUtterance(t.trim());u.lang="es-ES";u.rate=1.05;u.pitch=1.1;
  const v=pickVoice();if(v)u.voice=v;pending++;if(state!=="speaking")setState("speaking");
  u.onend=u.onerror=()=>{if(gen!==speechGen)return;pending=Math.max(0,pending-1);maybeDone()};speechSynthesis.speak(u)}
function speakStream(full,done){const rest=full.slice(spoken);let cut=-1;
  for(const p of [". ","? ","! ",": ","\n"]){const i=rest.lastIndexOf(p);if(i>=0&&i+p.length>cut)cut=i+p.length}
  if(done)cut=rest.length;if(cut>0){sayChunk(rest.slice(0,cut));spoken+=cut}}
function stopSpeaking(){speechGen++;if(TTS)speechSynthesis.cancel();pending=0}
function maybeDone(){if(pending>0||!streamDone)return;if(state==="speaking"||state==="thinking")setState("idle");if(convMode)setTimeout(()=>{if(state==="idle")listen()},400)}
function stopAll(){abortCtl&&abortCtl.abort();try{rec&&rec.abort()}catch(e){}stopSpeaking();streamDone=true;setState("idle")}

/* ---------- Micrófono (entrada) ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,heard="";
function listen(){
  if(!SR){add("ai","Este navegador no permite el micrófono. Abre ATLAS en Safari (iPhone) o Chrome (Android).","err");return}
  if(!apiKey){openCfg();return}
  stopSpeaking();heard="";
  rec=new SR();rec.lang="es-ES";rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  rec.onresult=e=>{let fin="",tmp="";for(const r of e.results){(r.isFinal?(fin+=r[0].transcript):(tmp+=r[0].transcript))}
    heard=(fin+" "+tmp).trim();$("sub").textContent="“"+heard+"”"};
  rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed")add("ai","No tengo permiso para el micrófono. En el iPhone: Ajustes › Safari › Micrófono › Permitir, y activa Dictado en Ajustes › General › Teclado.","err")};
  rec.onend=()=>{rec=null;const t=heard.trim();if(t)ask(t);else if(state==="listening")setState("idle")};
  try{rec.start();setState("listening")}catch(e){setState("idle")}
}
core.onclick=()=>{
  if(state==="listening"){rec&&rec.stop();return}
  if(state==="speaking"){stopSpeaking();streamDone=true;setState("idle");listen();return}
  if(state==="thinking"){stopAll();return}
  if(TTS)speechSynthesis.speak(new SpeechSynthesisUtterance(" "));/* desbloquea la voz en iPhone */
  listen();
};

/* ---------- Cerebro (API de Claude) ---------- */
async function ask(text){
  text=text.trim();if(!text)return;
  if(!apiKey){openCfg();return}
  add("me",text);$("input").value="";$("input").blur();
  history.push({role:"user",content:text});history=history.slice(-16);while(history.length&&history[0].role!=="user")history.shift();
  setState("thinking");const out=add("ai","…");
  stopSpeaking();spoken=0;streamDone=false;let full="";
  abortCtl=new AbortController();
  const now=new Date().toLocaleString("es",{dateStyle:"full",timeStyle:"short"});
  try{
    const body=JSON.stringify({model:MODEL,max_tokens:500,stream:true,system:SYSTEM+"\nFecha y hora actual: "+now+".",messages:history});
    const base={"content-type":"application/json","anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"};
    let res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:abortCtl.signal,headers:{...base,"x-api-key":apiKey},body});
    if(res.status===401)res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",signal:abortCtl.signal,headers:{...base,"authorization":"Bearer "+apiKey},body});
    if(!res.ok){let msg="";try{msg=(await res.json()).error?.message||""}catch(e){}
      throw new Error(res.status===401?"La clave de API no es válida. Revísala en Ajustes.":res.status===429?"Demasiadas peticiones seguidas. Espera unos segundos.":/credit|balance/i.test(msg)?"Tu cuenta no tiene crédito. Recarga saldo en platform.claude.com.":"Error "+res.status+": "+msg)}
    const reader=res.body.getReader();const dec=new TextDecoder();let buf="";
    while(true){const {value,done}=await reader.read();if(done)break;buf+=dec.decode(value,{stream:true});
      let i;while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);
        if(!line.startsWith("data:"))continue;let ev;try{ev=JSON.parse(line.slice(5))}catch(e){continue}
        if(ev.type==="content_block_delta"&&ev.delta&&ev.delta.type==="text_delta"){full+=ev.delta.text;out.textContent=full;log.scrollTop=log.scrollHeight;speakStream(full,false)}
        if(ev.type==="error")throw new Error(ev.error?.message||"Error del servicio")}}
    history.push({role:"assistant",content:full||"…"});
    speakStream(full,true);streamDone=true;
    if(!TTS||pending===0)maybeDone();
  }catch(e){
    history.pop();streamDone=true;
    out.parentElement.classList.add("err");
    out.textContent=e.name==="AbortError"?"Cancelado.":(e.message&&!/load failed|fetch/i.test(e.message)?e.message:"No pude conectar. Revisa tu conexión a internet.");
    stopSpeaking();setState("idle");
  }
}
$("form").addEventListener("submit",e=>{e.preventDefault();const t=$("input").value;if(TTS)speechSynthesis.speak(new SpeechSynthesisUtterance(" "));ask(t)});

/* ---------- Inicio ---------- */
setState("idle");paintCfg();
(function greet(){const h=new Date().getHours();const s=h<6?"Trabajando hasta tarde, jefe.":h<12?"Buenos días, jefe.":h<20?"Buenas tardes, jefe.":"Buenas noches, jefe.";
  add("ai",s+(apiKey?" Toque el núcleo y hablemos.":" Antes de empezar, necesito mi clave. Toque el engranaje para configurarla."))})();
if(!apiKey)openCfg();
</script>
